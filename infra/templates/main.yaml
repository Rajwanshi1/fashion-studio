AWSTemplateFormatVersion: '2010-09-09'
Description: fashion - main layer (app + edge - ECR, secrets, ASG behind internal ALB, storefront distro incl. /qr-socials + admin distro + API distro over VPC origin + WAF attach)
Parameters:
  EnvName:
    Type: String
    AllowedValues: [staging, prod]
  AppInstanceType:
    Type: String
    Default: t3.small
  AppMin:
    Type: Number
    Default: 2
  AppMax:
    Type: Number
    Default: 4
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  WafWebAclArn:
    Type: String
  # Default preserves staging's pre-existing repo name; prod passes
  # fashion-prod-api (RepositoryName changes force replacement, so the default
  # must stay byte-identical for staging).
  EcrRepoName:
    Type: String
    Default: fashion-studio-api
  DetailedMonitoring:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
  # Fail-closed payments contract: staging explicitly passes mock/'true';
  # anything else boots with payments disabled (checkout/confirm answer 503).
  PaymentProvider:
    Type: String
    AllowedValues: [mock, disabled]
    Default: disabled
  AllowMockPayments:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
  # Fail-closed OTP contract mirroring payments: staging passes console/'true';
  # anything else boots with phone-OTP login disabled (endpoints answer 503).
  SmsProvider:
    Type: String
    AllowedValues: [msg91, console, disabled]
    Default: disabled
  AllowConsoleOtp:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
  # Fail-closed WhatsApp invoice sends, same contract as SmsProvider: 'meta'
  # needs the whatsapp-access-token secret + phone-number-id param provisioned,
  # anything else boots with the send endpoint masked (503).
  WhatsAppProvider:
    Type: String
    AllowedValues: [meta, console, disabled]
    Default: disabled
  AllowConsoleWhatsApp:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
  # Browser origins allowed to PUT/GET the uploads bucket directly (presigned
  # URLs). '*' for domainless envs; the admin origin once a domain exists.
  UploadsCorsOrigins:
    Type: CommaDelimitedList
    Default: '*'
  # Vestigial: the API no longer reads ANTHROPIC_MODEL. Models are chosen per
  # document kind in backend/src/services/ai/prompts.ts, because a single global
  # override would read handwritten bills with Sonnet instead of the Opus 5 picked
  # for them (the API logs a warning if this reaches it). Left in place so
  # enabling parsing needs no stack update — drop it, and the -e below, at the
  # next deliberate `deploy.sh <env> stacks` run.
  AnthropicModel:
    Type: String
    Default: claude-sonnet-5
  # All three empty for domainless envs (staging).
  DomainName:
    Type: String
    Default: ''
  CertificateArn:
    Type: String
    Default: ''
  HostedZoneId:
    Type: String
    Default: ''
  # Ops inbox for the ALB alarms. '' (the default) creates no topic and leaves
  # both alarms action-less — the pre-alerts behaviour.
  AlertEmail:
    Type: String
    Default: ''
  # ARN of the media.<domain> cert from the waf stack (us-east-1 — see its
  # MediaCertificate). '' serves MediaDist on its *.cloudfront.net domain only.
  MediaCertificateArn:
    Type: String
    Default: ''
  # 'true' (the default — current behaviour) keeps the legacy public-read
  # statement and the loosened public-access block on the uploads bucket, so
  # raw S3 product URLs still resolve while they remain in the database and in
  # customers' order histories. Flip to 'false' ONLY after the one-time URL
  # backfill (docs/media-cdn-runbook.md, step 8) — from then on products/* is
  # readable through MediaDist alone.
  KeepLegacyPublicRead:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
Conditions:
  DetailedMonitoringOn: !Equals [!Ref DetailedMonitoring, 'true']
  HasDomain: !Not [!Equals [!Ref DomainName, '']]
  HasMediaCert: !Not [!Equals [!Ref MediaCertificateArn, '']]
  KeepPublicRead: !Equals [!Ref KeepLegacyPublicRead, 'true']
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, '']]
Resources:
  EcrRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Ref EcrRepoName
      ImageScanningConfiguration: { ScanOnPush: true }
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"keep last 10","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},"action":{"type":"expire"}}]}'
  JwtSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub 'fashion/${EnvName}/jwt-secret'
      GenerateSecretString: { PasswordLength: 48, ExcludePunctuation: true }
  SeedAdminSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub 'fashion/${EnvName}/seed-admin-password'
      GenerateSecretString: { PasswordLength: 20, ExcludePunctuation: true }
  SeedCustomerSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub 'fashion/${EnvName}/seed-customer-password'
      GenerateSecretString: { PasswordLength: 20, ExcludePunctuation: true }
  CorsParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/fashion/${EnvName}/cors-origins'
      Type: String
      Value: 'http://localhost:5173'
  ImageTagParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/fashion/${EnvName}/api-image-tag'
      Type: String
      Value: bootstrap
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/fashion/${EnvName}/api'
      RetentionInDays: 30
  # Admin photo uploads, two populations in one bucket:
  #   - Product images under products/, made public-read by the bucket policy
  #     below so their permanent URLs can sit in products.image_url and serve
  #     storefront <img> tags directly.
  #   - Customer documents (bills, measurement pages, shipping receipts), which
  #     carry names, phones and addresses. NO policy grants these, so they stay
  #     private and are read only through short-lived presigned GETs.
  # Either way the admin SPA uploads by presigned PUT, so browser CORS is needed.
  UploadsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'fashion-${EnvName}-uploads-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        # Loosened only while the legacy public-read statement below exists;
        # KeepLegacyPublicRead=false restores the full block (media-cdn step 8).
        BlockPublicPolicy: !If [KeepPublicRead, false, true]
        IgnorePublicAcls: true
        RestrictPublicBuckets: !If [KeepPublicRead, false, true]
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [PUT, GET]
            AllowedOrigins: !Ref UploadsCorsOrigins
            AllowedHeaders: ['*']
            MaxAge: 3600
  UploadsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref UploadsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # Legacy direct-S3 reads for the raw URLs still stored in the DB and
          # in shipped order histories. Dropped by KeepLegacyPublicRead=false
          # once the URL backfill has rewritten them to the media host.
          - !If
            - KeepPublicRead
            - Sid: PublicReadProductImages
              Effect: Allow
              Principal: '*'
              Action: s3:GetObject
              Resource: !Sub '${UploadsBucket.Arn}/products/*'
            - !Ref 'AWS::NoValue'
          # The media CDN's OAC read — products/* only; the private document
          # prefixes stay presign-only (same pattern as StorefrontBucketPolicy).
          - Sid: MediaDistRead
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub '${UploadsBucket.Arn}/products/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${MediaDist}'
  # Access logs for the media distribution — the raw material for tuning the
  # media-scrape-rate WAF limit. CloudFront standard logging writes via the
  # awslogsdelivery canonical-user ACL, so ACLs must be ENABLED on this bucket
  # (ObjectOwnership BucketOwnerPreferred); BucketOwnerEnforced would make the
  # distribution update fail with "bucket does not enable ACL access".
  MediaLogsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'fashion-${EnvName}-media-logs-${AWS::AccountId}'
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerPreferred }]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - { Id: expire-90d, Status: Enabled, ExpirationInDays: 90 }
  # Product photos served through the edge (media.<domain>) instead of raw S3
  # URLs: cached close to shoppers, WAF-rate-limited, and the only read path
  # for products/* once KeepLegacyPublicRead flips to false.
  MediaDist:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub 'fashion-${EnvName} media'
        HttpVersion: http2
        PriceClass: PriceClass_200
        WebACLId: !Ref WafWebAclArn
        Aliases: !If [HasMediaCert, [!Sub 'media.${DomainName}'], !Ref 'AWS::NoValue']
        ViewerCertificate: !If
          - HasMediaCert
          - { AcmCertificateArn: !Ref MediaCertificateArn, SslSupportMethod: sni-only, MinimumProtocolVersion: TLSv1.2_2021 }
          - { CloudFrontDefaultCertificate: true }
        Origins:
          - Id: s3
            DomainName: !GetAtt UploadsBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt Oac.Id
            S3OriginConfig: { OriginAccessIdentity: '' }
        DefaultCacheBehavior:
          TargetOriginId: s3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6   # Managed-CachingOptimized
        # NO CustomErrorResponses on purpose (unlike the SPA distributions):
        # this host serves <img> tags, so a missing photo must answer 403/404,
        # never a 200 with index.html — a broken image beats a corrupt one.
        Logging:
          Bucket: !GetAtt MediaLogsBucket.DomainName
          Prefix: cf/
          IncludeCookies: false
  AppRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: app-instance
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action: ['ecr:BatchGetImage', 'ecr:GetDownloadUrlForLayer', 'ecr:BatchCheckLayerAvailability']
                Resource: !GetAtt EcrRepo.Arn
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref JwtSecret
                  - !Ref SeedAdminSecret
                  - !Ref SeedCustomerSecret
                  - !ImportValue
                    'Fn::Sub': 'fashion-${EnvName}-db-secret-arn'
                  # Created manually (aws secretsmanager create-secret) when MSG91 goes live.
                  - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:fashion/${EnvName}/msg91-auth-key*'
                  # Created manually when bill parsing goes live — absent secret keeps parsing masked.
                  - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:fashion/${EnvName}/anthropic-api-key*'
                  # Created manually when WhatsApp invoice sends go live (docs/whatsapp-invoices.md).
                  - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:fashion/${EnvName}/whatsapp-access-token*'
              - Effect: Allow
                Action: ['s3:PutObject', 's3:GetObject']
                Resource: !Sub '${UploadsBucket.Arn}/*'
              - Effect: Allow
                Action: ['s3:PutObject', 's3:GetObject']
                Resource: !Sub '${UploadsBucket.Arn}/*'
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/fashion/${EnvName}/*'
              - Effect: Allow
                Action: ['logs:CreateLogStream', 'logs:PutLogEvents', 'logs:DescribeLogStreams']
                Resource: !GetAtt ApiLogGroup.Arn
  AppInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref AppRole]
  AppLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub 'fashion-${EnvName}-app'
      LaunchTemplateData:
        ImageId: !Ref AmiId
        InstanceType: !Ref AppInstanceType
        IamInstanceProfile: { Arn: !GetAtt AppInstanceProfile.Arn }
        SecurityGroupIds:
          - !ImportValue
            'Fn::Sub': 'fashion-${EnvName}-app-sg'
        # Hop limit 2: the API container (bridge network = one extra hop) now
        # talks to S3 itself, so it must be able to reach IMDSv2 for the
        # instance-role credentials.
        MetadataOptions: { HttpTokens: required, HttpEndpoint: enabled, HttpPutResponseHopLimit: 2 }
        Monitoring: { Enabled: !If [DetailedMonitoringOn, true, false] }
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs: { VolumeSize: 20, VolumeType: gp3, Encrypted: true }
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - { Key: Name, Value: !Sub 'fashion-${EnvName}-app' }
              - { Key: Project, Value: fashion-studio }
              - { Key: Env, Value: !Ref EnvName }
        UserData:
          # List-form Sub: MediaBaseUrl is conditional (empty when domainless),
          # and the API's config treats an empty MEDIA_BASE_URL as unset.
          Fn::Base64: !Sub
            - |
              #!/bin/bash
              set -uo pipefail
              exec > /var/log/user-data.log 2>&1
              dnf -y install docker
              systemctl enable --now docker

              REGION=${AWS::Region}
              REPO=${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${EcrRepoName}
              TAG=$(aws ssm get-parameter --name /fashion/${EnvName}/api-image-tag --region $REGION --query Parameter.Value --output text)
              aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com
              for i in $(seq 1 80); do docker pull $REPO:$TAG && break; echo "image $TAG not ready, retry $i"; sleep 15; done

              DB_PW=$(aws secretsmanager get-secret-value --secret-id fashion/${EnvName}/db-password --region $REGION --query SecretString --output text)
              JWT=$(aws secretsmanager get-secret-value --secret-id fashion/${EnvName}/jwt-secret --region $REGION --query SecretString --output text)
              CORS=$(aws ssm get-parameter --name /fashion/${EnvName}/cors-origins --region $REGION --query Parameter.Value --output text)
              # Both absent until MSG91 is provisioned; the API boots with OTP masked.
              MSG91_KEY=$(aws secretsmanager get-secret-value --secret-id fashion/${EnvName}/msg91-auth-key --region $REGION --query SecretString --output text 2>/dev/null || echo "")
              MSG91_TEMPLATE=$(aws ssm get-parameter --name /fashion/${EnvName}/msg91-template-id --region $REGION --query Parameter.Value --output text 2>/dev/null || echo "")
              # Absent until bill parsing is provisioned; the API boots with parsing masked.
              ANTHROPIC=$(aws secretsmanager get-secret-value --secret-id fashion/${EnvName}/anthropic-api-key --region $REGION --query SecretString --output text 2>/dev/null || echo "")
              # Both absent until the WhatsApp Business account is provisioned; invoice sends stay masked.
              WA_TOKEN=$(aws secretsmanager get-secret-value --secret-id fashion/${EnvName}/whatsapp-access-token --region $REGION --query SecretString --output text 2>/dev/null || echo "")
              WA_PNID=$(aws ssm get-parameter --name /fashion/${EnvName}/whatsapp-phone-number-id --region $REGION --query Parameter.Value --output text 2>/dev/null || echo "")
              until DATA_IP=$(aws ssm get-parameter --name /fashion/${EnvName}/db-host --region $REGION --query Parameter.Value --output text) && [ -n "$DATA_IP" ]; do echo "db-host param not ready"; sleep 15; done
              TOK=$(curl -sX PUT http://169.254.169.254/latest/api/token -H "X-aws-ec2-metadata-token-ttl-seconds: 300")
              IID=$(curl -s -H "X-aws-ec2-metadata-token: $TOK" http://169.254.169.254/latest/meta-data/instance-id)

              docker rm -f api 2>/dev/null || true
              docker run -d --name api --restart always -p 3001:3001 \
                --log-driver awslogs --log-opt awslogs-region=$REGION \
                --log-opt awslogs-group=/fashion/${EnvName}/api --log-opt awslogs-stream=$IID \
                -e NODE_ENV=production -e PORT=3001 \
                -e DATABASE_URL="postgres://boutique:$DB_PW@$DATA_IP:5432/boutique" \
                -e JWT_SECRET="$JWT" -e CORS_ORIGINS="$CORS" -e SEED_ON_START=false \
                -e PAYMENT_PROVIDER=${PaymentProvider} -e ALLOW_MOCK_PAYMENTS=${AllowMockPayments} \
                -e SMS_PROVIDER=${SmsProvider} -e ALLOW_CONSOLE_OTP=${AllowConsoleOtp} \
                -e MSG91_AUTH_KEY="$MSG91_KEY" -e MSG91_TEMPLATE_ID="$MSG91_TEMPLATE" \
                -e WHATSAPP_PROVIDER=${WhatsAppProvider} -e ALLOW_CONSOLE_WHATSAPP=${AllowConsoleWhatsApp} \
                -e WHATSAPP_ACCESS_TOKEN="$WA_TOKEN" -e WHATSAPP_PHONE_NUMBER_ID="$WA_PNID" \
                -e AWS_REGION=$REGION -e S3_UPLOADS_BUCKET=${UploadsBucket} \
                -e MEDIA_BASE_URL="${MediaBaseUrl}" \
                -e ANTHROPIC_API_KEY="$ANTHROPIC" -e ANTHROPIC_MODEL=${AnthropicModel} \
                $REPO:$TAG
            # Empty when domainless — the API's config treats '' as unset and
            # keeps building raw S3 URLs.
            - MediaBaseUrl: !If [HasDomain, !Sub 'https://media.${DomainName}', '']
  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub 'fashion-${EnvName}-alb'
      Scheme: internal
      Type: application
      SecurityGroups:
        - !ImportValue
          'Fn::Sub': 'fashion-${EnvName}-alb-sg'
      Subnets:
        - !ImportValue
          'Fn::Sub': 'fashion-${EnvName}-private-subnet-a'
        - !ImportValue
          'Fn::Sub': 'fashion-${EnvName}-private-subnet-b'
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !ImportValue
        'Fn::Sub': 'fashion-${EnvName}-vpc'
      Port: 3001
      Protocol: HTTP
      TargetType: instance
      HealthCheckPath: /api/ready
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: '30' }
  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - { Type: forward, TargetGroupArn: !Ref TargetGroup }
  Asg:
    Type: AWS::AutoScaling::AutoScalingGroup
    UpdatePolicy:
      AutoScalingRollingUpdate:
        MinInstancesInService: 1
        MaxBatchSize: 1
    Properties:
      AutoScalingGroupName: !Sub 'fashion-${EnvName}-app'
      MinSize: !Ref AppMin
      MaxSize: !Ref AppMax
      DesiredCapacity: !Ref AppMin
      HealthCheckType: ELB
      HealthCheckGracePeriod: 300
      VPCZoneIdentifier:
        - !ImportValue
          'Fn::Sub': 'fashion-${EnvName}-private-subnet-a'
        - !ImportValue
          'Fn::Sub': 'fashion-${EnvName}-private-subnet-b'
      TargetGroupARNs: [!Ref TargetGroup]
      LaunchTemplate:
        LaunchTemplateId: !Ref AppLaunchTemplate
        Version: !GetAtt AppLaunchTemplate.LatestVersionNumber
      Tags:
        - { Key: Project, Value: fashion-studio, PropagateAtLaunch: false }
  CpuScaling:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref Asg
      PolicyType: TargetTrackingScaling
      TargetTrackingConfiguration:
        PredefinedMetricSpecification: { PredefinedMetricType: ASGAverageCPUUtilization }
        TargetValue: 60
  # App-layer ops notifications (ap-south-1). The WAF alarms have their own
  # us-east-1 topic in waf.yaml — CLOUDFRONT-scope metrics only exist there.
  AlertTopic:
    Type: AWS::SNS::Topic
    Condition: HasAlertEmail
    Properties:
      TopicName: !Sub 'fashion-${EnvName}-alerts'
      Subscription:
        - { Protocol: email, Endpoint: !Ref AlertEmail }
  Alb5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: API 5xx spike
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions:
        - { Name: LoadBalancer, Value: !GetAtt Alb.LoadBalancerFullName }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlertEmail, [!Ref AlertTopic], !Ref 'AWS::NoValue']
      OKActions: !If [HasAlertEmail, [!Ref AlertTopic], !Ref 'AWS::NoValue']
  UnhealthyHostsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: targets failing /api/ready
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Dimensions:
        - { Name: LoadBalancer, Value: !GetAtt Alb.LoadBalancerFullName }
        - { Name: TargetGroup, Value: !GetAtt TargetGroup.TargetGroupFullName }
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlertEmail, [!Ref AlertTopic], !Ref 'AWS::NoValue']
      OKActions: !If [HasAlertEmail, [!Ref AlertTopic], !Ref 'AWS::NoValue']
  Oac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub 'fashion-${EnvName}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  SpaHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub 'fashion-${EnvName}-spa-headers'
        SecurityHeadersConfig:
          StrictTransportSecurity: { AccessControlMaxAgeSec: 63072000, IncludeSubdomains: true, Override: true }
          ContentTypeOptions: { Override: true }
          FrameOptions: { FrameOption: DENY, Override: true }
          ReferrerPolicy: { ReferrerPolicy: strict-origin-when-cross-origin, Override: true }
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: "default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src https:; frame-src https://accounts.google.com; object-src 'none'; base-uri 'self'"
  # script-src carries 'wasm-unsafe-eval' because the bill/measurement photo intake
  # decodes HEIC with libheif compiled to wasm (admin/src/lib/image.ts). Chromium and
  # Firefox cannot read HEIC natively, so a gallery-picked iPhone photo falls through to
  # that decoder, and Chrome refuses to compile ANY WebAssembly unless script-src allows
  # it — the upload failed in prod with "Compiling or instantiating WebAssembly module
  # violates the following Content Security policy directive". Nothing reproduces this
  # locally: vite serves no CSP, and the admin unit tests mock the wasm module.
  # 'wasm-unsafe-eval' permits wasm compilation ONLY — unlike 'unsafe-eval' it leaves
  # eval() and new Function() blocked — so keep the narrow keyword. The storefront
  # policy above deliberately does NOT get it; only admin ships libheif.
  AdminHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub 'fashion-${EnvName}-admin-headers'
        SecurityHeadersConfig:
          StrictTransportSecurity: { AccessControlMaxAgeSec: 63072000, IncludeSubdomains: true, Override: true }
          ContentTypeOptions: { Override: true }
          FrameOptions: { FrameOption: DENY, Override: true }
          ReferrerPolicy: { ReferrerPolicy: strict-origin-when-cross-origin, Override: true }
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src https:; object-src 'none'; base-uri 'self'"
        CustomHeadersConfig:
          Items:
            - { Header: X-Robots-Tag, Value: noindex, Override: true }
  # The socials SPA lives under qr-socials/ in the storefront bucket and is
  # served through the storefront distribution at /qr-socials/. CloudFront only
  # resolves DefaultRootObject at the domain root, so the two entry paths must
  # be rewritten to the app's index.html (assets are exact-key fetches and pass
  # through untouched). Without this, /qr-socials/ would 403 into the
  # distribution-wide SPA fallback and serve the storefront's index instead.
  QrSocialsRewriteFn:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub 'fashion-${EnvName}-qr-socials-rewrite'
      AutoPublish: true
      FunctionConfig:
        Comment: Serve the socials SPA index for /qr-socials and /qr-socials/
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          if (request.uri === '/qr-socials' || request.uri === '/qr-socials/') {
            request.uri = '/qr-socials/index.html';
          }
          return request;
        }
  StorefrontBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'fashion-${EnvName}-web-storefront-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
  StorefrontDist:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub 'fashion-${EnvName} storefront'
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_200
        WebACLId: !Ref WafWebAclArn
        Aliases: !If [HasDomain, [!Ref DomainName, !Sub 'www.${DomainName}'], !Ref 'AWS::NoValue']
        ViewerCertificate: !If
          - HasDomain
          - { AcmCertificateArn: !Ref CertificateArn, SslSupportMethod: sni-only, MinimumProtocolVersion: TLSv1.2_2021 }
          - !Ref 'AWS::NoValue'
        Origins:
          - Id: s3
            DomainName: !GetAtt StorefrontBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt Oac.Id
            S3OriginConfig: { OriginAccessIdentity: '' }
        DefaultCacheBehavior:
          TargetOriginId: s3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6   # Managed-CachingOptimized
          ResponseHeadersPolicyId: !Ref SpaHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt QrSocialsRewriteFn.FunctionMetadata.FunctionARN
        CustomErrorResponses:
          - { ErrorCode: 403, ResponseCode: 200, ResponsePagePath: /index.html, ErrorCachingMinTTL: 10 }
          - { ErrorCode: 404, ResponseCode: 200, ResponsePagePath: /index.html, ErrorCachingMinTTL: 10 }
  StorefrontBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref StorefrontBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub '${StorefrontBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${StorefrontDist}'
  AdminBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'fashion-${EnvName}-web-admin-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
  AdminDist:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub 'fashion-${EnvName} admin'
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_200
        WebACLId: !Ref WafWebAclArn
        Aliases: !If [HasDomain, [!Sub 'admin.${DomainName}'], !Ref 'AWS::NoValue']
        ViewerCertificate: !If
          - HasDomain
          - { AcmCertificateArn: !Ref CertificateArn, SslSupportMethod: sni-only, MinimumProtocolVersion: TLSv1.2_2021 }
          - !Ref 'AWS::NoValue'
        Origins:
          - Id: s3
            DomainName: !GetAtt AdminBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt Oac.Id
            S3OriginConfig: { OriginAccessIdentity: '' }
        DefaultCacheBehavior:
          TargetOriginId: s3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6   # Managed-CachingOptimized
          ResponseHeadersPolicyId: !Ref AdminHeadersPolicy
        CustomErrorResponses:
          - { ErrorCode: 403, ResponseCode: 200, ResponsePagePath: /index.html, ErrorCachingMinTTL: 10 }
          - { ErrorCode: 404, ResponseCode: 200, ResponsePagePath: /index.html, ErrorCachingMinTTL: 10 }
  AdminBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AdminBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub '${AdminBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${AdminDist}'
  ApiVpcOrigin:
    Type: AWS::CloudFront::VpcOrigin
    Properties:
      VpcOriginEndpointConfig:
        Name: !Sub 'fashion-${EnvName}-api-vpco'
        Arn: !Ref Alb
        HTTPPort: 80
        OriginProtocolPolicy: http-only
  ApiDist:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub 'fashion-${EnvName} api'
        HttpVersion: http2
        PriceClass: PriceClass_200
        WebACLId: !Ref WafWebAclArn
        Aliases: !If [HasDomain, [!Sub 'api.${DomainName}'], !Ref 'AWS::NoValue']
        ViewerCertificate: !If
          - HasDomain
          - { AcmCertificateArn: !Ref CertificateArn, SslSupportMethod: sni-only, MinimumProtocolVersion: TLSv1.2_2021 }
          - !Ref 'AWS::NoValue'
        Origins:
          - Id: alb
            DomainName: !GetAtt Alb.DNSName
            VpcOriginConfig:
              VpcOriginId: !GetAtt ApiVpcOrigin.Id
        DefaultCacheBehavior:
          TargetOriginId: alb
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          Compress: true
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad          # Managed-CachingDisabled
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac  # Managed-AllViewerExceptHostHeader
  # A + AAAA aliases for every hostname -> its CloudFront distribution.
  # Z2FDTNDATAQYW2 is CloudFront's fixed hosted-zone ID for alias targets.
  DnsRecords:
    Type: AWS::Route53::RecordSetGroup
    Condition: HasDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      RecordSets:
        - { Name: !Ref DomainName, Type: A, AliasTarget: { HostedZoneId: Z2FDTNDATAQYW2, DNSName: !GetAtt StorefrontDist.DomainName } }
        - { Name: !Ref DomainName, Type: AAAA, AliasTarget: { HostedZoneId: Z2FDTNDATAQYW2, DNSName: !GetAtt StorefrontDist.DomainName } }
        - { Name: !Sub 'www.${DomainName}', Type: A, AliasTarget: { HostedZoneId: Z2FDTNDATAQYW2, DNSName: !GetAtt StorefrontDist.DomainName } }
        - { Name: !Sub 'www.${DomainName}', Type: AAAA, AliasTarget: { HostedZoneId: Z2FDTNDATAQYW2, DNSName: !GetAtt StorefrontDist.DomainName } }
        - { Name: !Sub 'admin.${DomainName}', Type: A, AliasTarget: { HostedZoneId: Z2FDTNDATAQYW2, DNSName: !GetAtt AdminDist.DomainName } }
        - { Name: !Sub 'admin.${DomainName}', Type: AAAA, AliasTarget: { HostedZoneId: Z2FDTNDATAQYW2, DNSName: !GetAtt AdminDist.DomainName } }
        - { Name: !Sub 'api.${DomainName}', Type: A, AliasTarget: { HostedZoneId: Z2FDTNDATAQYW2, DNSName: !GetAtt ApiDist.DomainName } }
        - { Name: !Sub 'api.${DomainName}', Type: AAAA, AliasTarget: { HostedZoneId: Z2FDTNDATAQYW2, DNSName: !GetAtt ApiDist.DomainName } }
        - { Name: !Sub 'media.${DomainName}', Type: A, AliasTarget: { HostedZoneId: Z2FDTNDATAQYW2, DNSName: !GetAtt MediaDist.DomainName } }
        - { Name: !Sub 'media.${DomainName}', Type: AAAA, AliasTarget: { HostedZoneId: Z2FDTNDATAQYW2, DNSName: !GetAtt MediaDist.DomainName } }
Outputs:
  EcrUri:
    Value: !GetAtt EcrRepo.RepositoryUri
  AsgName:
    Value: !Ref Asg
  StorefrontDomain: { Value: !GetAtt StorefrontDist.DomainName }
  AdminDomain: { Value: !GetAtt AdminDist.DomainName }
  ApiDomain: { Value: !GetAtt ApiDist.DomainName }
  StorefrontBucket: { Value: !Ref StorefrontBucket }
  AdminBucket: { Value: !Ref AdminBucket }
  UploadsBucket: { Value: !Ref UploadsBucket }
  StorefrontDistId: { Value: !Ref StorefrontDist }
  AdminDistId: { Value: !Ref AdminDist }
  MediaDomain: { Value: !GetAtt MediaDist.DomainName }
  MediaDistId: { Value: !Ref MediaDist }
