AWSTemplateFormatVersion: '2010-09-09'
Description: fashion - CloudFront WAF (deploy in us-east-1; CLOUDFRONT scope requires it)
Parameters:
  EnvName:
    Type: String
    AllowedValues: [staging, prod]
  # Both empty for domainless envs (staging). The cert lives here because
  # CloudFront requires ACM certs in us-east-1, and this is the one stack
  # already deployed there.
  DomainName:
    Type: String
    Default: ''
  HostedZoneId:
    Type: String
    Default: ''
  # Ops inbox for WAF alarms. '' (the default) creates no topic and no alarm —
  # byte-identical behaviour to the pre-alerts stack.
  AlertEmail:
    Type: String
    Default: ''
Conditions:
  HasDomain: !Not [!Equals [!Ref DomainName, '']]
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, '']]
Resources:
  # DNS validation completes only after the registrar delegates to the Route 53
  # zone — deploy.sh gates this stack behind an NS-delegation check so the
  # deployment fails fast instead of hanging here.
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Condition: HasDomain
    Properties:
      DomainName: !Ref DomainName
      SubjectAlternativeNames:
        - !Sub 'www.${DomainName}'
        - !Sub 'admin.${DomainName}'
        - !Sub 'api.${DomainName}'
      ValidationMethod: DNS
      DomainValidationOptions:
        - { DomainName: !Ref DomainName, HostedZoneId: !Ref HostedZoneId }
        - { DomainName: !Sub 'www.${DomainName}', HostedZoneId: !Ref HostedZoneId }
        - { DomainName: !Sub 'admin.${DomainName}', HostedZoneId: !Ref HostedZoneId }
        - { DomainName: !Sub 'api.${DomainName}', HostedZoneId: !Ref HostedZoneId }
      Tags: [{ Key: Project, Value: fashion-studio }, { Key: Env, Value: !Ref EnvName }]
  # Separate cert for the media CDN host — deliberately NOT a new SAN on the
  # Certificate above: changing an ACM cert's SAN set REPLACES the cert, and
  # the existing one is in use by three live CloudFront distributions, so a
  # replacement would race deletion of the old cert against the distributions
  # letting go of it. A second cert has no such trap.
  MediaCertificate:
    Type: AWS::CertificateManager::Certificate
    Condition: HasDomain
    Properties:
      DomainName: !Sub 'media.${DomainName}'
      ValidationMethod: DNS
      DomainValidationOptions:
        - { DomainName: !Sub 'media.${DomainName}', HostedZoneId: !Ref HostedZoneId }
      Tags: [{ Key: Project, Value: fashion-studio }, { Key: Env, Value: !Ref EnvName }]
  WebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub 'fashion-${EnvName}'
      Scope: CLOUDFRONT
      DefaultAction: { Allow: {} }
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub 'fashion-${EnvName}-acl'
      Rules:
        - Name: rate-limit-per-ip
          Priority: 0
          Action: { Block: {} }
          Statement:
            RateBasedStatement: { Limit: 2000, AggregateKeyType: IP }
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub 'fashion-${EnvName}-rate'
        - Name: aws-common
          Priority: 1
          OverrideAction: { None: {} }
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
              # SizeRestrictions_BODY blocks every request body over 8KB, which
              # kills the product-image presign: it carries the photo as ~2.7MB
              # of base64 so Claude can name the object after what it shows.
              # Counted here rather than excluded, so the rule still reports, and
              # re-blocked at priority 2 for every OTHER path — the relaxation is
              # scoped to that one route instead of the whole ACL. The rest of the
              # rule set (SQLi, XSS, bad inputs) still applies to that route.
              RuleActionOverrides:
                - Name: SizeRestrictions_BODY
                  ActionToUse: { Count: {} }
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub 'fashion-${EnvName}-common'
        # Restores a body cap everywhere except the image-naming presign.
        # 32KB (was 8KB): a product update with a 12-image gallery and long
        # description legitimately crosses 8KB, and the WAF's bare 403 carries
        # no CORS headers, so the admin saw it as an opaque network failure.
        # The app's own bodyLimit still caps JSON at 100KB behind this.
        # Case-sensitive path match on purpose: a request that varies the casing
        # fails the NOT and gets blocked, so the exemption cannot be widened by
        # rewriting the URI.
        - Name: oversize-body-except-image-naming
          Priority: 2
          Action: { Block: {} }
          Statement:
            AndStatement:
              Statements:
                - SizeConstraintStatement:
                    FieldToMatch: { Body: { OversizeHandling: CONTINUE } }
                    ComparisonOperator: GT
                    Size: 32768
                    TextTransformations: [{ Priority: 0, Type: NONE }]
                - NotStatement:
                    Statement:
                      AndStatement:
                        Statements:
                          - ByteMatchStatement:
                              FieldToMatch: { UriPath: {} }
                              PositionalConstraint: EXACTLY
                              SearchString: /api/admin/uploads/product-image
                              TextTransformations: [{ Priority: 0, Type: NONE }]
                          - ByteMatchStatement:
                              FieldToMatch: { Method: {} }
                              PositionalConstraint: EXACTLY
                              SearchString: POST
                              TextTransformations: [{ Priority: 0, Type: NONE }]
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub 'fashion-${EnvName}-oversize-body'
        # Catalogue-scrape brake for the media CDN. Heavy HUMAN browsing runs
        # ~300–600 image requests per 5 minutes (PDP galleries + renditions),
        # and WAF counts BEFORE the CloudFront cache, so cache hits count too —
        # 1000/5min clears every real shopper with headroom, while a scraper
        # pulling the whole catalogue (hundreds of products × gallery ×
        # renditions) blows through it in seconds. A referer/hotlink rule is
        # deliberately omitted: it would break WhatsApp/OG link previews and
        # Google Images, which fetch with no or foreign referers.
        - Name: media-scrape-rate
          Priority: 3
          Action: { Block: {} }
          Statement:
            RateBasedStatement:
              Limit: 1000
              AggregateKeyType: IP
              ScopeDownStatement:
                ByteMatchStatement:
                  FieldToMatch: { UriPath: {} }
                  PositionalConstraint: STARTS_WITH
                  SearchString: /products/
                  TextTransformations: [{ Priority: 0, Type: NONE }]
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub 'fashion-${EnvName}-media-rate'
  # Alerts live in THIS stack (us-east-1) because CLOUDFRONT-scope WAF metrics
  # only exist in us-east-1 — an ap-south-1 alarm would watch an empty metric.
  AlertTopic:
    Type: AWS::SNS::Topic
    Condition: HasAlertEmail
    Properties:
      TopicName: !Sub 'fashion-${EnvName}-waf-alerts'
      Subscription:
        - { Protocol: email, Endpoint: !Ref AlertEmail }
  # NOTE: confirm the exact dimension set against a real datapoint at changeset
  # time (aws cloudwatch list-metrics --namespace AWS/WAFV2 --region us-east-1) —
  # WAFV2 publishes WebACL/Rule/Region=Global for CLOUDFRONT scope, but a
  # mismatch here fails silently (alarm stays INSUFFICIENT_DATA/notBreaching).
  MediaScrapeAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlertEmail
    Properties:
      AlarmDescription: media-scrape-rate WAF rule blocked at least one request (possible catalogue scrape)
      Namespace: AWS/WAFV2
      MetricName: BlockedRequests
      Dimensions:
        - { Name: WebACL, Value: !Sub 'fashion-${EnvName}' }
        - { Name: Rule, Value: media-scrape-rate }
        - { Name: Region, Value: Global }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]
Outputs:
  WebAclArn:
    Value: !GetAtt WebAcl.Arn
  CertificateArn:
    Condition: HasDomain
    Value: !Ref Certificate
  MediaCertificateArn:
    Condition: HasDomain
    Value: !Ref MediaCertificate
