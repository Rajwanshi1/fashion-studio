<style>
  body.shop { background: var(--forest-800); color: var(--celadon-100); display: flex; flex-direction: column; min-height: 100vh; }

  .nf .inner { position: relative; z-index: 2; max-width: 540px; }
  .nf .eyebrow { color: var(--gold-soft); display: block; margin-bottom: 1.4rem; }
  .nf h1 { font-family: var(--serif-soft); font-style: italic; font-weight: 300; font-size: clamp(2rem,5vw,3.2rem); line-height: 1.15; margin-bottom: 1.2rem; }
  .nf p { color: var(--celadon-200); font-size: var(--t-sm); max-width: 42ch; margin: 0 auto 2.2rem; }
  .nf .actions { display: flex; gap: 0.8rem; justify-content: center; flex-wrap: wrap; }
  .nf .actions a { min-width: 180px; }
  .nf .btn-buy.gold { background: var(--gold); color: var(--forest-800); }
  .nf .btn-outline { color: var(--celadon-100); border-color: var(--gold-soft); }
  .nf .btn-outline:hover { background: rgba(228,212,180,0.12); border-color: var(--gold-soft); }
  .nf .links { margin-top: 2.5rem; display: flex; gap: 1.4rem; justify-content: center; flex-wrap: wrap; font-size: 0.66rem; letter-spacing: var(--track-wide); text-transform: uppercase; }
  .nf .links a { color: var(--celadon-200); border-bottom: 1px solid rgba(228,212,180,0.3); padding-bottom: 2px; }
  .nf .links a:hover { color: var(--gold-pale); }
  .nf-brand { padding: 1.6rem var(--gutter); text-align: center; font-family: var(--serif-display); font-size: 1.3rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--celadon-50); }
</style>
