services:
  db:
    image: postgres:16-alpine
    container_name: boutique-db
    environment:
      POSTGRES_USER: boutique
      POSTGRES_PASSWORD: boutique
      POSTGRES_DB: boutique
    ports:
      - "5433:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boutique -d boutique"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    container_name: boutique-api
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://boutique:boutique@db:5432/boutique
      JWT_SECRET: dev-secret-change-in-prod
      CORS_ORIGINS: http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:4173,http://localhost:4174,http://localhost:4175
      SEED_ON_START: "true"
      PORT: "3001"
      # Passed through from the host so no key is ever committed. Compose also
      # reads a root .env automatically, so either `export ANTHROPIC_API_KEY=...`
      # or a gitignored root .env works. Empty is a supported state: the API
      # boots with parsing masked and /parse answers 503, exactly as the
      # deployed launch template behaves when the secret is absent.
      #
      # Without this the container CANNOT see the key under any circumstance —
      # backend/.dockerignore excludes .env and the Dockerfile never copies it —
      # so the intake wizard always toasts "Document parsing is not configured".
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Console by default in dev: sends are logged, never delivered. Set the
      # meta provider + real creds in a root .env to smoke-test real delivery.
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-console}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
